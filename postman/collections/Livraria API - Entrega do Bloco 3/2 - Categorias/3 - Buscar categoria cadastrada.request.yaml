$kind: http-request
url: "{{baseUrl}}/categorias/{{categoriaId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Veio o item cadastrado", function () {
          pm.expect(pm.response.json().id).to.eql(pm.collectionVariables.get("categoriaId"));
      });
    language: text/javascript
order: 3000
