$kind: http-request
url: "{{baseUrl}}/livros?titulo=teste entrega"
method: GET
queryParams:
  titulo: teste entrega
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Encontrou pelo menos um livro", function () {
          pm.expect(pm.response.json().length).to.be.above(0);
      });
    language: text/javascript
order: 4000
