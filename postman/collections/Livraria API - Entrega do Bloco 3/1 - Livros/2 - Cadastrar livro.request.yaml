$kind: http-request
url: "{{baseUrl}}/livros"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "titulo": "Livro Teste Entrega",
      "autor": "Grupo",
      "preco": 10,
      "estoque": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });
      pm.collectionVariables.set("livroId", pm.response.json().id);
    language: text/javascript
order: 2000
