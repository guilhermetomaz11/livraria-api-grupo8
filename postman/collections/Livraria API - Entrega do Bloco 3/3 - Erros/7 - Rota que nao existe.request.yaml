$kind: http-request
url: "{{baseUrl}}/rota-que-nao-existe"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404", function () {
          pm.response.to.have.status(404);
      });
      pm.test("Resposta em JSON", function () {
          pm.response.to.be.json;
      });
    language: text/javascript
order: 7000
