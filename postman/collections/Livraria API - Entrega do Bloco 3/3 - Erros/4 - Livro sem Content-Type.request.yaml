$kind: http-request
url: "{{baseUrl}}/livros"
method: POST
body:
  type: text
  content: |-
    {
      "titulo": "Livro Teste Entrega",
      "autor": "Grupo",
      "preco": 10,
      "estoque": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 4000
