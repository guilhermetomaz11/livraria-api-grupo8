$kind: http-request
url: "{{baseUrl}}/livros"
method: POST
body:
  type: json
  content: "{\r

    \    \"titulo\": \"X\",\r

    \    \"autor\": \"Y\",\r

    \    \"preco\": \"abc\",\r

    \    \"estoque\": 1\r

    }"
scripts:
